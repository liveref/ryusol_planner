<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>오늘의 하루 일과</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=Gaegu:wght@400;700&family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap');

  :root{
    --paper:#F3F2EC;
    --paper-line:#E4E1D6;
    --ink:#242320;
    --ink-soft:#6B6A62;
    --surface:#FFFFFF;
    --life:#BE5A42;
    --life-soft:#F3E0D8;
    --study:#33507C;
    --study-soft:#DEE5F0;
    --good:#3F8F6F;
    --good-soft:#DCEDE3;
    --admin:#B8863A;
    --admin-soft:#F5E9D3;
    --radius-s:6px;
    --radius-m:12px;
    --font-heading:'Space Grotesk', sans-serif;
    --font-body:'Manrope', system-ui, sans-serif;
    --bg-image: repeating-linear-gradient(to bottom, transparent 0px, transparent 37px, var(--paper-line) 37px, var(--paper-line) 38px);
    --bg-size: auto;
  }

  /* ---------- color themes ---------- */
  body.theme-dark{
    --paper:#1C1B19; --paper-line:#2E2C28; --ink:#EDEAE2; --ink-soft:#9C978A; --surface:#252320;
    --life:#E08469; --life-soft:#3A2A22; --study:#7FA0D6; --study-soft:#232C3D;
    --good:#6FC79B; --good-soft:#1F3128; --admin:#E0B565; --admin-soft:#3A2E15;
  }
  body.theme-pastel{
    --paper:#FBF6FA; --paper-line:#EDE2F0; --ink:#4A3F4D; --ink-soft:#8C7F8F; --surface:#FFFFFF;
    --life:#E893A8; --life-soft:#FBE3E9; --study:#8FA6E0; --study-soft:#E7EBFA;
    --good:#7DC9A0; --good-soft:#DFF3E7; --admin:#E0B15C; --admin-soft:#FBEED9;
  }
  body.theme-space{
    --paper:#0E1330; --paper-line:#1D2450; --ink:#E9ECFF; --ink-soft:#8890C4; --surface:#171C3E;
    --life:#FF8A5C; --life-soft:#3A2418; --study:#6BD1E8; --study-soft:#10303A;
    --good:#7CE8A8; --good-soft:#0F3320; --admin:#FFD166; --admin-soft:#3A2E10;
  }

  /* ---------- fonts ---------- */
  body.font-handwriting{ --font-heading:'Gaegu', cursive; --font-body:'Gaegu', cursive; }
  body.font-rounded{ --font-heading:'Jua', sans-serif; --font-body:'Jua', sans-serif; }
  body.font-clean{ --font-heading:'Noto Sans KR', sans-serif; --font-body:'Noto Sans KR', sans-serif; }

  /* ---------- backgrounds ---------- */
  body.bg-dot{ --bg-image: radial-gradient(var(--paper-line) 1.4px, transparent 1.6px); --bg-size: 20px 20px; }
  body.bg-plain{ --bg-image: none; }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--font-body);
    color:var(--ink);
    background-image: var(--bg-image);
    background-color: var(--paper);
    background-size: var(--bg-size);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:28px 16px 60px;
  }
  .shell{width:100%; max-width:460px;}
  h1,h2,h3{font-family:var(--font-heading); margin:0;}

  /* ---------- header ---------- */
  .header{padding:4px 4px 20px;}
  .header-top{display:flex; justify-content:space-between; align-items:flex-start; gap:12px;}
  .greeting{font-size:22px; font-weight:700; letter-spacing:-0.01em;}
  .date{margin-top:4px; font-size:13.5px; color:var(--ink-soft);}
  .shared-note{margin-top:3px; font-size:12px; color:var(--ink-soft); display:flex; align-items:center; gap:6px;}
  .sync-dot-wrap{display:inline-flex; align-items:center; gap:4px; font-size:11px; color:var(--good); font-weight:700;}
  .sync-dot{width:7px; height:7px; border-radius:50%; background:var(--good); flex-shrink:0; animation:syncPulse 2s ease-in-out infinite;}
  @keyframes syncPulse{ 0%,100%{opacity:1; transform:scale(1);} 50%{opacity:.4; transform:scale(0.72);} }
  @media (prefers-reduced-motion: reduce){ .sync-dot{animation:none;} }
  .admin-toggle{
    display:flex; align-items:center; gap:6px;
    background:var(--surface); border:1px solid var(--paper-line);
    border-radius:999px; padding:7px 12px; font-size:12.5px; font-weight:600;
    color:var(--ink-soft); cursor:pointer; white-space:nowrap;
  }
  .admin-toggle.on{background:var(--admin-soft); border-color:var(--admin); color:#8A6423;}
  .admin-toggle svg{width:14px;height:14px;flex-shrink:0;}

  .rewards-bar{display:flex; gap:8px; margin-top:16px; flex-wrap:wrap;}
  .reward-pill{display:flex; align-items:center; gap:6px; padding:7px 12px; border-radius:999px; font-size:12.5px; font-weight:700; font-family:var(--font-heading);}
  .reward-pill.stars{background:var(--admin-soft); color:#8A6423;}
  .reward-pill.streak{background:#EFEDE6; color:var(--ink);}
  .reward-pill.level{background:var(--good-soft); color:var(--good);}

  .level-progress-wrap{margin-top:9px;}
  .level-progress-track{height:6px; border-radius:999px; background:var(--paper-line); overflow:hidden;}
  .level-progress-fill{height:100%; background:var(--good); border-radius:999px; transition:width .3s ease;}
  .level-progress-label{font-size:11px; color:var(--ink-soft); margin-top:5px;}

  .badges-row{display:flex; gap:7px; margin-top:11px; flex-wrap:wrap;}
  .badge-chip{display:flex; align-items:center; gap:5px; padding:5px 10px; border-radius:999px; font-size:11.5px; font-weight:600; border:1px solid var(--paper-line); background:var(--surface); color:var(--ink-soft);}
  .badge-chip.earned{background:var(--admin-soft); border-color:#E6CFA0; color:#7A5A22;}
  .badge-chip .emo{font-size:14px; filter:grayscale(1); opacity:.45;}
  .badge-chip.earned .emo{filter:none; opacity:1;}

  .progress-row{margin-top:16px; display:flex; align-items:center; gap:14px;}
  .ring-wrap{position:relative; width:52px; height:52px; flex-shrink:0;}
  .ring-wrap svg{transform:rotate(-90deg);}
  .ring-pct{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:var(--font-heading); font-size:13px; font-weight:700;}
  .progress-text{font-size:13.5px; color:var(--ink-soft);}
  .progress-text b{color:var(--ink); font-weight:700;}
  .reset-link{margin-left:auto; font-size:12.5px; color:var(--ink-soft); background:none; border:none; text-decoration:underline; text-underline-offset:2px; cursor:pointer; padding:4px;}

  .admin-banner{margin-top:14px; background:var(--admin-soft); border:1px solid #E6CFA0; color:#7A5A22; font-size:12.5px; padding:9px 12px; border-radius:var(--radius-s); line-height:1.5;}

  .header-actions{display:flex; gap:8px; margin-top:14px; flex-wrap:wrap;}
  .header-action-btn{font-size:12.5px; font-weight:600; color:var(--ink-soft); background:var(--surface); border:1px solid var(--paper-line); border-radius:999px; padding:7px 13px; cursor:pointer; white-space:nowrap;}
  .header-action-btn.cheer{color:#8A6423; border-color:#E6CFA0; background:var(--admin-soft);}
  .cheer-picker{display:flex; gap:6px; flex-wrap:wrap; margin-top:9px; padding:10px; background:var(--paper); border-radius:var(--radius-s);}
  .cheer-option{font-size:13px; font-weight:600; padding:8px 12px; border-radius:999px; border:1px solid var(--paper-line); background:var(--surface); cursor:pointer; white-space:nowrap;}

  .settings-panel{margin-top:9px; padding:12px; background:var(--paper); border-radius:var(--radius-s); display:flex; flex-direction:column; gap:12px;}
  .settings-group-label{font-size:11.5px; font-weight:700; color:var(--ink-soft); margin-bottom:7px;}
  .settings-row{display:flex; gap:7px; flex-wrap:wrap;}
  .settings-swatch{display:flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; padding:7px 11px; border-radius:999px; border:1.5px solid var(--paper-line); background:var(--surface); color:var(--ink-soft); cursor:pointer;}
  .settings-swatch.active{border-color:var(--ink); color:var(--ink); background:var(--good-soft);}
  .settings-swatch-dot{width:13px; height:13px; border-radius:50%; flex-shrink:0; border:1px solid rgba(0,0,0,0.12);}

  .bonus-card{margin-top:14px; border:1.5px dashed var(--admin); background:linear-gradient(135deg, var(--admin-soft), #FBF3E1); border-radius:var(--radius-m); padding:12px 13px; display:flex; align-items:center; gap:11px; cursor:pointer;}
  .bonus-card.done{opacity:.7;}
  .bonus-emoji{font-size:26px; flex-shrink:0; line-height:1;}
  .bonus-text{flex:1; min-width:0;}
  .bonus-label{font-size:10.5px; font-weight:700; color:#8A6423; margin-bottom:2px; letter-spacing:.02em;}
  .bonus-title{font-size:14px; font-weight:700; color:var(--ink); line-height:1.4;}
  .bonus-check{width:24px;height:24px; border-radius:50%; border:2px solid var(--admin); display:flex;align-items:center;justify-content:center; flex-shrink:0; background:var(--surface);}
  .bonus-check.done{background:var(--admin);}
  .bonus-check svg{width:13px;height:13px;color:#fff; opacity:0;}
  .bonus-check.done svg{opacity:1;}

  .mission-manage{margin-top:14px; border:1.5px dashed var(--admin); background:var(--admin-soft); border-radius:var(--radius-m); padding:12px 13px;}
  .mission-manage-title{font-size:12.5px; font-weight:700; color:#8A6423; margin-bottom:10px;}
  .mission-row{display:flex; gap:7px; align-items:center; margin-bottom:7px;}
  .mission-emo-input{width:42px; text-align:center; font-size:16px; font-family:inherit; border:1px solid var(--paper-line); border-radius:6px; padding:7px 2px; background:var(--surface); flex-shrink:0;}
  .mission-text-input{flex:1; min-width:0; font-size:13px; font-family:inherit; border:1px solid var(--paper-line); border-radius:6px; padding:7px 9px; background:var(--surface);}
  .mission-del{width:26px;height:26px;flex-shrink:0; display:flex;align-items:center;justify-content:center; border:none;background:transparent;color:#B0503F; cursor:pointer;border-radius:6px;}
  .mission-del:hover{background:#F6DEDB;}
  .mission-add-row{display:flex; gap:7px; align-items:center; margin-top:6px;}
  .mission-add-row button{font-size:13px; font-weight:600; font-family:var(--font-heading); border:none; border-radius:6px; padding:0 14px; height:34px; background:var(--ink); color:#fff; cursor:pointer; flex-shrink:0;}
  .mission-empty-note{font-size:12.5px; color:#8A6423; margin-top:2px; margin-bottom:8px;}

  /* ---------- tabs ---------- */
  .tabs{display:flex; gap:6px; margin-top:22px; padding:0 4px;}
  .tab{flex:1; text-align:center; padding:11px 6px 10px; font-family:var(--font-heading); font-weight:600; font-size:14px; border-radius:var(--radius-s) var(--radius-s) 0 0; cursor:pointer; color:var(--ink-soft); background:#EAE7DC; border:1px solid var(--paper-line); border-bottom:none; position:relative; top:1px;}
  .tab .tab-count{display:block; font-family:var(--font-body); font-weight:500; font-size:11px; margin-top:2px; opacity:.75;}
  .tab.active{background:var(--surface); color:var(--ink); border-color:var(--paper-line);}
  .tab.active.life{border-top:3px solid var(--life); color:var(--life);}
  .tab.active.study{border-top:3px solid var(--study); color:var(--study);}
  .tab.active.stats{border-top:3px solid var(--ink); color:var(--ink);}
  .tab:focus-visible{outline:2px solid var(--ink); outline-offset:2px;}

  .panel{background:var(--surface); border:1px solid var(--paper-line); border-radius:0 0 var(--radius-m) var(--radius-m); padding:14px;}

  /* ---------- item card ---------- */
  .item{background:var(--surface); border:1px solid var(--paper-line); border-left:4px solid var(--cat-color, var(--life)); border-radius:var(--radius-m); margin-bottom:10px; overflow:hidden;}
  .item:last-child{margin-bottom:0;}
  .item.complete{background:var(--cat-soft, var(--good-soft)); animation:pop .32s ease;}
  @keyframes pop{0%{transform:scale(1);} 35%{transform:scale(1.015);} 100%{transform:scale(1);}}

  .item-head{display:flex; align-items:center; gap:10px; padding:13px 12px; cursor:pointer; min-height:44px;}
  .item-head .chev{width:16px;height:16px;flex-shrink:0;color:var(--ink-soft); transition:transform .18s ease;}
  .item.open .item-head .chev{transform:rotate(90deg);}
  .daytype-tag{font-size:10.5px; font-weight:600; color:var(--ink-soft); background:var(--paper); border:1px solid var(--paper-line); border-radius:999px; padding:2px 7px; white-space:nowrap;}
  .item-name{flex:1; font-weight:600; font-size:15px; line-height:1.4;}
  .item-name-input{flex:1; font-weight:600; font-size:15px; font-family:inherit; border:1px solid var(--paper-line); border-radius:6px; padding:6px 8px; background:#FBFAF6;}
  .item-badge{font-size:12px; font-weight:700; color:var(--ink-soft); font-family:var(--font-heading); white-space:nowrap;}
  .item.complete .item-badge{color:var(--good);}
  .item-check{width:19px;height:19px;flex-shrink:0;}
  .item-check svg{width:100%;height:100%;color:var(--good);}
  .del-btn{width:26px;height:26px;flex-shrink:0; display:flex;align-items:center;justify-content:center; border:none;background:transparent;color:#B0503F; cursor:pointer;border-radius:6px;}
  .del-btn:hover{background:#F6DEDB;}

  .daytype-row{display:flex; gap:6px; padding:0 12px 10px 40px; flex-wrap:wrap;}
  .daytype-chip{font-size:11.5px; font-weight:600; padding:4px 9px; border-radius:999px; border:1px solid var(--paper-line); background:var(--surface); color:var(--ink-soft); cursor:pointer;}
  .daytype-chip.active{background:var(--ink); color:#fff; border-color:var(--ink);}

  .sub-list{padding:0 14px 12px 40px; display:flex; flex-direction:column; gap:2px;}
  .sub-row{display:flex; align-items:center; gap:10px; padding:8px 4px; min-height:40px;}
  .checkbox{width:20px;height:20px;flex-shrink:0; border:1.75px solid #C9C6BA; border-radius:5px; display:flex;align-items:center;justify-content:center; cursor:pointer; background:var(--surface);}
  .checkbox.checked{background:var(--cat-color, var(--life)); border-color:var(--cat-color, var(--life));}
  .checkbox svg{width:13px;height:13px;color:#fff;opacity:0;transition:opacity .1s;}
  .checkbox.checked svg{opacity:1;}
  .sub-name{flex:1; font-size:14px; cursor:pointer; line-height:1.4;}
  .sub-name.done{color:var(--ink-soft); text-decoration:line-through; text-decoration-color:#C9C6BA;}
  .sub-name-input{flex:1; font-size:14px; font-family:inherit; border:1px solid var(--paper-line); border-radius:6px; padding:5px 7px; background:#FBFAF6;}
  .sub-del{width:22px;height:22px;flex-shrink:0; display:flex;align-items:center;justify-content:center; border:none;background:transparent;color:#B0503F; cursor:pointer;border-radius:6px;}
  .sub-del:hover{background:#F6DEDB;}

  .add-row{display:flex; gap:8px; padding:8px 4px 2px; flex-wrap:wrap;}
  .add-row input[type="text"]{flex:1; min-width:120px; font-size:13.5px; font-family:inherit; border:1px dashed #C9C6BA; border-radius:6px; padding:8px 9px; background:#FBFAF6;}
  .add-row select{font-size:13px; font-family:inherit; border:1px dashed #C9C6BA; border-radius:6px; padding:8px 6px; background:#FBFAF6;}
  .add-row button{font-size:13px; font-weight:600; font-family:var(--font-heading); border:none; border-radius:6px; padding:0 14px; background:var(--ink); color:#fff; cursor:pointer;}

  .add-item-row{margin-top:2px; padding:2px 2px 0;}
  .add-item-row .add-row input[type="text"]{border-style:dashed;}

  .sub-note-area{background:var(--paper); border-radius:9px; padding:9px 10px 10px; margin:2px 0 9px;}
  .sub-note-label{font-size:11px; font-weight:700; color:var(--study); margin-bottom:6px;}
  .note-input{width:100%; font-size:13px; font-family:inherit; border:1px solid var(--paper-line); border-radius:7px; padding:7px 9px; background:var(--surface);}
  .photo-add-btn{display:inline-flex; align-items:center; gap:5px; font-size:12.5px; font-weight:600; color:var(--study); background:var(--study-soft); border:1px dashed var(--study); border-radius:999px; padding:6px 12px; cursor:pointer; margin-top:8px;}
  .photo-thumb-wrap{position:relative; display:inline-block; margin-top:8px;}
  .photo-thumb{display:block; max-width:220px; max-height:160px; border-radius:8px; border:1px solid var(--paper-line); object-fit:cover;}
  .photo-remove{position:absolute; top:-7px; right:-7px; width:22px;height:22px;border-radius:50%; background:var(--ink); color:#fff; border:2px solid var(--surface); display:flex;align-items:center;justify-content:center; cursor:pointer; font-size:12px; line-height:1; padding:0;}
  .photo-pending{font-size:12px; color:var(--ink-soft); margin-top:8px;}

  .empty-state{padding:26px 12px; text-align:center; color:var(--ink-soft); font-size:13.5px; line-height:1.6;}

  /* ---------- stats panel ---------- */
  .stats-section{margin-bottom:22px;}
  .stats-section:last-child{margin-bottom:2px;}
  .stats-title{font-family:var(--font-heading); font-size:14px; font-weight:700; margin-bottom:11px;}
  .heatmap-row{display:flex; gap:6px;}
  .heatmap-day{display:flex; flex-direction:column; align-items:center; gap:5px; flex:1; min-width:0;}
  .heatmap-dow{font-size:11px; color:var(--ink-soft); font-weight:600;}
  .heatmap-square{width:100%; aspect-ratio:1; border-radius:7px; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:700; color:#fff;}
  .heatmap-date{font-size:9.5px; color:var(--ink-soft);}
  .stats-summary{font-size:13.5px; color:var(--ink-soft); line-height:1.7;}
  .stats-summary b{color:var(--ink);}
  .missed-card{margin-top:8px; background:var(--paper); border:1px solid var(--paper-line); border-radius:var(--radius-s); padding:11px 12px; font-size:13px; line-height:1.6; color:var(--ink);}

  .compare-bars{display:flex; flex-direction:column; gap:9px; margin-top:2px;}
  .compare-row{display:flex; align-items:center; gap:9px;}
  .compare-label{font-size:11.5px; color:var(--ink-soft); width:46px; flex-shrink:0;}
  .compare-track{flex:1; height:10px; border-radius:999px; background:var(--paper-line); overflow:hidden;}
  .compare-fill{height:100%; border-radius:999px;}
  .compare-fill.prev{background:#B7B3A4;}
  .compare-fill.now{background:var(--good);}
  .compare-pct{font-size:11.5px; font-weight:700; color:var(--ink-soft); width:34px; text-align:right; flex-shrink:0;}
  .compare-message{margin-top:10px; font-size:13px; color:var(--ink); line-height:1.5;}

  .sticker-grid{display:flex; flex-wrap:wrap; gap:8px; margin-top:2px;}
  .sticker-chip{position:relative; width:44px;height:44px; border-radius:10px; background:var(--paper); border:1px solid var(--paper-line); display:flex; align-items:center; justify-content:center; font-size:21px;}
  .sticker-count{position:absolute; bottom:-5px; right:-5px; background:var(--ink); color:#fff; font-size:9.5px; font-weight:700; border-radius:999px; min-width:16px; height:16px; display:flex; align-items:center; justify-content:center; padding:0 3px;}
  .sticker-total{font-size:12.5px; color:var(--ink-soft); margin-bottom:9px;}

  /* ---------- toast ---------- */
  .toast{position:fixed; left:50%; top:18px; transform:translateX(-50%) translateY(-14px); background:var(--ink); color:#fff; padding:11px 18px; border-radius:999px; font-size:13.5px; font-weight:600; box-shadow:0 6px 18px rgba(0,0,0,0.18); opacity:0; pointer-events:none; transition:opacity .25s ease, transform .25s ease; z-index:50; white-space:nowrap;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  @media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important;} }

  .loading{padding:60px 10px; text-align:center; color:var(--ink-soft); font-size:14px;}
</style>
</head>
<body>
  <div class="shell" id="root"><div class="loading">불러오는 중…</div></div>
  <div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  var ROUTINE_COLLECTION = "routine";
  var ROUTINE_DOC_ID = "shared";
  var PHOTOS_COLLECTION = "photos";
  var HISTORY_DAYS_KEPT = 90;

  var fbDb=null, fbDoc=null, fbSetDoc=null, fbGetDoc=null, fbDeleteDoc=null, fbOnSnapshot=null;
  function waitForFirebase(){
    return new Promise(function(resolve){
      if(window.__fb){ resolve(window.__fb); return; }
      window.addEventListener("firebase-ready", function(){ resolve(window.__fb); }, { once:true });
    });

  function computeDayStats(dateStr){
    var dateObj = parseDateStr(dateStr);
    var rec = state.data.history[dateStr];
    var hasRecord = !!rec;
    var doneSet = {};
    if(rec) rec.doneSubIds.forEach(function(id){ doneSet[id]=true; });
    var totalSubs=0, doneSubs=0, itemsTotal=0, itemsComplete=0;
    Object.keys(state.data.categories).forEach(function(catKey){
      state.data.categories[catKey].items.forEach(function(item){
        if(!appliesToDate(item, dateObj)) return;
        if(item.subItems.length===0) return;
        itemsTotal++;
        var doneCount=0;
        item.subItems.forEach(function(sub){ if(doneSet[sub.id]) doneCount++; });
        totalSubs += item.subItems.length;
        doneSubs += doneCount;
        if(doneCount === item.subItems.length) itemsComplete++;
      });
    });
    return { doneSubs:doneSubs, totalSubs:totalSubs, itemsTotal:itemsTotal, itemsComplete:itemsComplete, dayComplete: itemsTotal>0 && itemsComplete===itemsTotal, hasRecord:hasRecord };
  }

  function computeRewards(){
    var totalStars=0;
    var completeFlags={};
    var dates = Object.keys(state.data.history).sort();
    dates.forEach(function(d){
      var st = computeDayStats(d);
      var rec = state.data.history[d];
      var bonusStars = (rec && rec.bonusMissionDone) ? 5 : 0;
      totalStars += st.doneSubs + st.itemsComplete*3 + (st.dayComplete ? 10 : 0) + bonusStars;
      completeFlags[d] = st.dayComplete;
    });

    var current=0;
    var cursor = new Date();
    var tKey = todayStr();
    if(!completeFlags[tKey]) cursor = addDays(cursor, -1);
    while(true){
      var key = formatDate(cursor);
      if(completeFlags[key]){ current++; cursor = addDays(cursor, -1); }
      else break;
    }

    var longest=0, run=0, prevDate=null;
    dates.forEach(function(d){
      if(completeFlags[d]){
        if(prevDate !== null && formatDate(addDays(prevDate,1)) === d) run++;
        else run=1;
        if(run>longest) longest=run;
      } else {
        run=0;
      }
      prevDate = parseDateStr(d);
    });
    longest = Math.max(longest, current);

    return { totalStars:totalStars, currentStreak:current, longestStreak:longest };
  }

  function mostMissedItem(){

      var rec = state.data.history[formatDate(d)];
      if(!rec) continue; // skip days the app wasn't actually used - don't count as a "missed" day
      var doneSet = {};
      rec.doneSubIds.forEach(function(id){ doneSet[id]=true; });
      Object.keys(state.data.categories).forEach(function(catKey){
        state.data.categories[catKey].items.forEach(function(item){
          if(item.subItems.length===0) return;
          if(!appliesToDate(item, d)) return;
          if(!stats[item.id]) stats[item.id] = { name:item.name, cat:catKey, sumRate:0, days:0 };
          var doneCount=0;
          item.subItems.forEach(function(sub){ if(doneSet[sub.id]) doneCount++; });
          stats[item.id].sumRate += doneCount / item.subItems.length;
          stats[item.id].days += 1;
        });
      });
    }
    var worst=null;
    Object.keys(stats).forEach(function(id){
      var s = stats[id];
      if(s.days < 3) return;
      var avg = s.sumRate / s.days;
      if(!worst || avg < worst.avg) worst = { name:s.name, cat:s.cat, avg:avg };

    return worst;
  }

  function readAndCompressImage(file){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onerror = function(){ reject(new Error("파일을 읽지 못했어요")); };
      reader.onload = function(){
        var img = new Image();
        img.onerror = function(){ reject(new Error("이미지를 불러오지 못했어요")); };
        img.onload = function(){
          try{
            var maxDim = 900;
            var w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
            var scale = Math.min(1, maxDim / Math.max(w,h));
            var cw = Math.max(1, Math.round(w*scale)), ch = Math.max(1, Math.round(h*scale));
            var canvas = document.createElement("canvas");
            canvas.width = cw; canvas.height = ch;
            var ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, cw, ch);
            resolve(canvas.toDataURL("image/jpeg", 0.72));
          }catch(err){ reject(err); }
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

    var missed = mostMissedItem();

    var html = '<div class="panel">';

    html += '<div class="stats-section">';
    html += '<div class="stats-title">최근 7일</div>';
    html += '<div class="heatmap-row">';
    wk.forEach(function(d){
      var pctShow = d.pct<0 ? "" : (d.pct + "%");
      html += '<div class="heatmap-day">';
      html += '  <div class="heatmap-dow">' + DOW_LABEL[d.date.getDay()] + '</div>';
      html += '  <div class="heatmap-square" style="background:' + heatColor(d.pct) + ';">' + pctShow + '</div>';

      html += '</div>';

    html += '</div>';
    html += '</div>';

    html += '<div class="stats-section">';
    html += '<div class="stats-title">이번 주 vs 저번 주</div>';

    if(cmp.thisWeek===null){
      html += '<div class="stats-summary">아직 비교할 데이터가 부족해요. 며칠 더 기록해보면 알려드릴게요.</div>';
    } else {
      html += '<div class="compare-bars">';
      html += '  <div class="compare-row"><div class="compare-label">저번 주</div><div class="compare-track"><div class="compare-fill prev" style="width:' + (cmp.lastWeek===null?0:cmp.lastWeek) + '%;"></div></div><div class="compare-pct">' + (cmp.lastWeek===null?"–":cmp.lastWeek+"%") + '</div></div>';
      html += '  <div class="compare-row"><div class="compare-label">이번 주</div><div class="compare-track"><div class="compare-fill now" style="width:' + cmp.thisWeek + '%;"></div></div><div class="compare-pct">' + cmp.thisWeek + '%</div></div>';
      html += '</div>';
      if(cmp.lastWeek===null){
        html += '<div class="compare-message">저번 주 기록이 아직 없어서 비교는 다음 주부터 가능해요.</div>';

        var diff = cmp.thisWeek - cmp.lastWeek;
        var msg;
        if(diff >= 5) msg = '저번 주보다 ' + diff + '%p 더 잘했어요! 🎉';

        else msg = '저번 주와 비슷한 흐름이에요. 꾸준함이 최고예요 👍';

    html += '</div>';

    html += '</div>';

    html += '</div>';

  function render(){
    if(!state.data){ root.innerHTML = '<div class="loading">불러오는 중…</div>'; return; }
    var html = renderHeader() + renderTabs();
    if(state.activeTab==="stats") html += renderStatsPanel();
    else html += renderItemsPanel(state.activeTab);
    root.innerHTML = html;
  }

  function findItemAnyCat(itemId){
    var found=null, catKey=null;
    Object.keys(state.data.categories).forEach(function(k){
      var it = state.data.categories[k].items.find(function(x){ return x.id===itemId; });
      if(it){ found=it; catKey=k; }
    });
    return { item:found, catKey:catKey };
  }

  async function persistAndRerender(){ await saveData(); render(); }

  root.addEventListener("click", function(e){
    var el = e.target.closest("[data-action]");
    if(!el) return;
    var action = el.getAttribute("data-action");
    if(action==="stop") return;

    if(action==="toggle-admin"){ state.adminMode = !state.adminMode; render(); return; }
    if(action==="set-tab"){ state.activeTab = el.getAttribute("data-tab"); render(); return; }
    if(action==="toggle-expand"){
      var itemId = el.getAttribute("data-item");
      state.expanded[itemId] = !state.expanded[itemId];
      render();
      return;
    }
    if(action==="toggle-sub"){
      if(state.adminMode) return;
      var prevOverall = overallTodayProgress();
      var prevDayComplete = prevOverall.total>0 && prevOverall.done===prevOverall.total;
      var it = findItemAnyCat(el.getAttribute("data-item")).item;
      var subId = el.getAttribute("data-sub");
      var rec = ensureTodayEntry();
      var idx = rec.doneSubIds.indexOf(subId);
      var wasItemComplete = itemProgress(it).done === itemProgress(it).total && itemProgress(it).total>0;
      if(idx>=0) rec.doneSubIds.splice(idx,1); else rec.doneSubIds.push(subId);

      var pAfterItem = itemProgress(it);
      var nowItemComplete = pAfterItem.total>0 && pAfterItem.done===pAfterItem.total;
      var nowOverall = overallTodayProgress();
      var nowDayComplete = nowOverall.total>0 && nowOverall.done===nowOverall.total;
      var awardedSticker = null;
      if(!prevDayComplete && nowDayComplete){
        awardedSticker = maybeAwardSticker(todayStr());
      }

      saveData().then(function(){
        render();
        if(!prevDayComplete && nowDayComplete){
          showToast("오늘 하루 올클리어! ⭐ +10" + (awardedSticker ? (" " + awardedSticker + " 스티커 획득!") : ""));
        } else if(!wasItemComplete && nowItemComplete){
          showToast(it.name + " 완료! ⭐ +3");
        }
      });
      return;
    }
    if(action==="toggle-bonus-mission"){
      if(state.adminMode) return;
      var missionRec = ensureTodayEntry();
      var wasMissionDone = missionRec.bonusMissionDone;
      missionRec.bonusMissionDone = !wasMissionDone;
      saveData().then(function(){
        render();
        if(!wasMissionDone && missionRec.bonusMissionDone){
          showToast("깜짝 미션 완료! ⭐ +5");
        }
      });
      return;
    }
    if(action==="toggle-cheer-picker"){
      state.cheerPickerOpen = !state.cheerPickerOpen;
      state.settingsOpen = false;
      render();
      return;
    }
    if(action==="toggle-settings"){
      state.settingsOpen = !state.settingsOpen;
      state.cheerPickerOpen = false;
      render();
      return;
    }
    if(action==="set-setting"){
      var kind = el.getAttribute("data-kind");
      var value = el.getAttribute("data-value");
      if(!state.settings) state.settings = Object.assign({}, DEFAULT_SETTINGS);
      state.settings[kind] = value;
      applySettingsToBody();
      saveSettingsSync();
      render();
      return;
    }
    if(action==="send-cheer"){
      var presetIdx = parseInt(el.getAttribute("data-idx"), 10);
      var preset = CHEER_PRESETS[presetIdx];
      if(!preset) return;
      var cheerId = uid("cheer");
      state.data.lastCheer = { id:cheerId, emo:preset.emo, text:preset.text, ts:Date.now() };
      state.lastSeenCheerId = cheerId;
      state.cheerPickerOpen = false;
      saveData().then(function(){
        render();
        showToast("응원을 보냈어요 " + preset.emo);
      });
      return;
    }
    if(action==="set-daytype"){
      var catKey0 = el.getAttribute("data-cat");
      var it0 = findItemAnyCat(el.getAttribute("data-item")).item;
      it0.dayType = el.getAttribute("data-daytype");
      persistAndRerender();
      return;
    }
    if(action==="delete-item"){
      var catKey = el.getAttribute("data-cat");
      var iid = el.getAttribute("data-item");
      state.data.categories[catKey].items = state.data.categories[catKey].items.filter(function(it){ return it.id!==iid; });
      delete state.expanded[iid];
      persistAndRerender();
      return;
    }
    if(action==="delete-sub"){
      var it2 = findItemAnyCat(el.getAttribute("data-item")).item;
      it2.subItems = it2.subItems.filter(function(s){ return s.id!==el.getAttribute("data-sub"); });
      persistAndRerender();
      return;
    }
    if(action==="add-sub"){
      var itemId2 = el.getAttribute("data-item");
      var input = root.querySelector('input[data-field="new-sub-input"][data-item="'+itemId2+'"]');
      var val = input.value.trim();
      if(!val) return;
      var it3 = findItemAnyCat(itemId2).item;
      it3.subItems.push({ id: uid("sub"), name: val });
      persistAndRerender();
      return;
    }
    if(action==="add-item"){
      var catKey2 = el.getAttribute("data-cat");
      var input2 = root.querySelector('input[data-field="new-item-input"][data-cat="'+catKey2+'"]');
      var sel = root.querySelector('select[data-field="new-item-daytype"][data-cat="'+catKey2+'"]');
      var val2 = input2.value.trim();
      if(!val2) return;
      var newItem = { id: uid("item"), name: val2, dayType: sel ? sel.value : "all", subItems: [] };
      state.data.categories[catKey2].items.push(newItem);
      state.expanded[newItem.id] = true;
      persistAndRerender();
      return;
    }
    if(action==="add-mission"){
      var newEmoInput = root.querySelector('input[data-field="new-mission-emo"]');
      var newTextInput = root.querySelector('input[data-field="new-mission-text"]');
      var newText = newTextInput.value.trim();
      if(!newText) return;
      var newEmo = newEmoInput.value.trim() || "🎁";
      if(!state.data.missionPool) state.data.missionPool = [];
      state.data.missionPool.push({ id: uid("mission"), emo:newEmo, text:newText });
      persistAndRerender();
      return;
    }
    if(action==="delete-mission"){
      var missionId = el.getAttribute("data-mission");
      state.data.missionPool = (state.data.missionPool||[]).filter(function(m){ return m.id!==missionId; });
      persistAndRerender();
      return;
    }
    if(action==="remove-photo"){
      var rpSubId = el.getAttribute("data-sub");
      var rpNote = ensureSubNote(rpSubId);
      rpNote.hasPhoto = false;
      delete state.photoCache[rpSubId];
      fbDeleteDoc(photoRef(todayStr()+"_"+rpSubId)).catch(function(){});
      persistAndRerender();
      return;
    }
    if(action==="reset-today"){
      var tKeyReset = todayStr();
      var oldRec = state.data.history[tKeyReset];
      if(oldRec && oldRec.notes){
        Object.keys(oldRec.notes).forEach(function(subId){
          if(oldRec.notes[subId].hasPhoto){
            fbDeleteDoc(photoRef(tKeyReset+"_"+subId)).catch(function(){});
            delete state.photoCache[subId];
          }
        });
      }
      state.data.history[tKeyReset] = { doneSubIds: [], notes: {} };
      persistAndRerender();
      return;
    }
  });

  root.addEventListener("change", function(e){
    var t = e.target;
    if(!t.matches || !t.matches('input[data-field="photo-input"]')) return;
    var itemId = t.getAttribute("data-item");
    var subId = t.getAttribute("data-sub");
    var file = t.files && t.files[0];
    if(!file) return;
    showToast("사진 저장 중…");
    readAndCompressImage(file).then(function(dataUrl){
      return fbSetDoc(photoRef(todayStr()+"_"+subId), { dataUrl: dataUrl }).then(function(){
        state.photoCache[subId] = dataUrl;
        var note = ensureSubNote(subId);
        note.hasPhoto = true;
        return saveData();
      });
    }).then(function(){
      showToast("인증사진이 저장됐어요 📷");
      render();
    }).catch(function(err){
      console.error("사진 저장 실패", err);
      showToast("사진 저장에 실패했어요. 다시 시도해주세요.");
    });
  });

  root.addEventListener("keydown", function(e){
    if(e.key!=="Enter") return;
    var t = e.target;
    var field = t.getAttribute && t.getAttribute("data-field");
    if(field==="new-sub-input"){
      e.preventDefault();
      var btn = root.querySelector('[data-action="add-sub"][data-item="'+t.getAttribute("data-item")+'"]');
      if(btn) btn.click();
    }
    if(field==="new-item-input"){
      e.preventDefault();
      var btn2 = root.querySelector('[data-action="add-item"][data-cat="'+t.getAttribute("data-cat")+'"]');
      if(btn2) btn2.click();
    }
    if(field==="new-mission-emo" || field==="new-mission-text"){
      e.preventDefault();
      var btn3 = root.querySelector('[data-action="add-mission"]');
      if(btn3) btn3.click();
    }
    if(field==="item-name" || field==="sub-name" || field==="sub-note" || field==="mission-emo" || field==="mission-text"){ e.preventDefault(); t.blur(); }
    if(t.classList && t.classList.contains("tab")){ t.click(); }
  });

  root.addEventListener("blur", function(e){
    var t = e.target;
    if(!t.getAttribute) return;
    var field = t.getAttribute("data-field");
    if(field==="item-name"){
      var it = findItemAnyCat(t.getAttribute("data-item")).item;
      var val = t.value.trim();
      if(val && val!==it.name){ it.name=val; saveData(); }
    }
    if(field==="sub-name"){
      var it2 = findItemAnyCat(t.getAttribute("data-item")).item;
      var sub = it2.subItems.find(function(s){ return s.id===t.getAttribute("data-sub"); });
      var val2 = t.value.trim();
      if(val2 && val2!==sub.name){ sub.name=val2; saveData(); }
    }
    if(field==="sub-note"){
      var noteRec = ensureSubNote(t.getAttribute("data-sub"));
      var val3 = t.value.trim();
      if(val3 !== noteRec.text){ noteRec.text = val3; saveData(); }
    }
    if(field==="mission-emo"){
      var m1 = (state.data.missionPool||[]).find(function(m){ return m.id===t.getAttribute("data-mission"); });
      if(m1){ var v1 = t.value.trim() || "🎁"; if(v1!==m1.emo){ m1.emo=v1; saveData(); } }
    }
    if(field==="mission-text"){
      var m2 = (state.data.missionPool||[]).find(function(m){ return m.id===t.getAttribute("data-mission"); });
      if(m2){ var v2 = t.value.trim(); if(v2 && v2!==m2.text){ m2.text=v2; saveData(); } }
    }
    flushPendingUpdateIfIdle();
  }, true);

  function isUserTyping(){
    var el = document.activeElement;
    return !!(el && root.contains(el) && (el.tagName==="INPUT" || el.tagName==="TEXTAREA" || el.tagName==="SELECT"));
  }

  async function refreshMissingPhotos(){
    var rec = state.data.history[todayStr()];
    if(!rec || !rec.notes) return;
    var fetches = [];
    Object.keys(rec.notes).forEach(function(subId){
      if(rec.notes[subId].hasPhoto && !state.photoCache[subId]){
        fetches.push(
          fbGetDoc(photoRef(todayStr()+"_"+subId)).then(function(snap){
            if(snap.exists()) state.photoCache[subId] = snap.data().dataUrl;
          }).catch(function(){})
        );
      }
    });
    if(fetches.length) await Promise.all(fetches);
  }

  var pendingRemoteUpdate = null;

  function applyRemoteUpdate(incoming){
    var prevOverall = overallTodayProgress();
    var prevDayComplete = prevOverall.total>0 && prevOverall.done===prevOverall.total;
    var prevRewards = computeRewards();

    state.data = normalizeData(incoming);
    state.lastRawSnapshot = JSON.stringify(state.data);

    var todayRec = ensureTodayEntry();
    Object.keys(state.photoCache).forEach(function(subId){
      var n = todayRec.notes[subId];
      if(!n || !n.hasPhoto) delete state.photoCache[subId];
    });

    refreshMissingPhotos().then(function(){
      render();

      var nowOverall = overallTodayProgress();
      var nowDayComplete = nowOverall.total>0 && nowOverall.done===nowOverall.total;
      var nowRewards = computeRewards();
      var newBadge = BADGES.find(function(b){ return nowRewards.longestStreak>=b.days && prevRewards.longestStreak<b.days; });
      var incomingCheer = state.data.lastCheer;
      var hasNewCheer = incomingCheer && incomingCheer.id !== state.lastSeenCheerId;

      if(!prevDayComplete && nowDayComplete){
        var todaySticker = (state.data.stickers||[]).find(function(s){ return s.date===todayStr(); });
        showToast("오늘 하루 올클리어! ⭐ +10" + (todaySticker ? (" " + todaySticker.emoji + " 스티커 획득!") : ""));
      } else if(hasNewCheer){
        showToast("💌 응원이 도착했어요: " + incomingCheer.emo + " " + incomingCheer.text);
      } else if(newBadge){
        showToast(newBadge.emo + " " + newBadge.name + " 배지 획득!");
      }
      if(incomingCheer) state.lastSeenCheerId = incomingCheer.id;
    });
  }

  function handleRoutineSnapshot(snap){
    if(!snap.exists()) return;
    if(snap.metadata && snap.metadata.hasPendingWrites) return; // our own optimistic local echo - skip
    var incoming = snap.data();
    var incomingJson = JSON.stringify(incoming);
    if(incomingJson === state.lastRawSnapshot) return; // nothing actually changed
    if(isUserTyping()){ pendingRemoteUpdate = incoming; return; }
    applyRemoteUpdate(incoming);
  }

  // If a remote update arrived while the person was typing, apply it once they're done
  // (checked shortly after any field loses focus, so the browser has settled the next
  // focus target before we decide whether typing has truly stopped).
  function flushPendingUpdateIfIdle(){
    setTimeout(function(){
      if(pendingRemoteUpdate && !isUserTyping()){
        var pending = pendingRemoteUpdate;
        pendingRemoteUpdate = null;
        applyRemoteUpdate(pending);
      }
    }, 50);
  }

  (async function init(){
    state.settings = loadSettingsSync();
    applySettingsToBody();

    var fb = await Promise.race([
      waitForFirebase(),
      new Promise(function(resolve){ setTimeout(function(){ resolve(null); }, 12000); })
    ]);
    if(!fb){
      root.innerHTML = '<div class="loading">서버 연결에 실패했어요.<br/>인터넷 연결을 확인하고 새로고침 해주세요.</div>';
      return;
    }
    fbDb = fb.db; fbDoc = fb.doc; fbSetDoc = fb.setDoc; fbGetDoc = fb.getDoc; fbDeleteDoc = fb.deleteDoc; fbOnSnapshot = fb.onSnapshot;

    var data = await loadRoutineData();
    if(!data) data = defaultData();
    state.data = normalizeData(data);
    state.lastSeenCheerId = state.data.lastCheer ? state.data.lastCheer.id : null;
    var todayItems = state.data.categories.life.items.filter(function(it){ return appliesToDate(it, new Date()); });
    if(todayItems[0]) state.expanded[todayItems[0].id] = true;

    var tRec = ensureTodayEntry();
    var photoFetches = [];
    Object.keys(tRec.notes).forEach(function(subId){
      if(tRec.notes[subId].hasPhoto){
        photoFetches.push(
          fbGetDoc(photoRef(todayStr()+"_"+subId)).then(function(snap){
            if(snap.exists()) state.photoCache[subId] = snap.data().dataUrl;
          }).catch(function(){})
        );
      }
    });
    await Promise.all(photoFetches);

    await saveData();
    render();

    fbOnSnapshot(routineRef(), handleRoutineSnapshot);
  })();

})();
</script>
